services:
    postgres:
        image: postgres:latest
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql

    redis:
        image: redis:latest
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        ports:
            - "8080:80"
        volumes:
            - ./backend:/var/www/backend
        environment:
            DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
            REDIS_URL: redis://redis:6379
        depends_on:
            - postgres
            - redis
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        ports:
            - "3000:80"

volumes:
    postgres_data:
    redis_data:
